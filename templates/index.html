<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地知识库问答</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 750px; max-width: 95%; background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: #1677ff; color: white; padding: 18px 24px; font-size: 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 8px; }
        .header-actions button { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .header-actions button:hover { background: rgba(255,255,255,0.3); }
        .chat-box { height: 480px; overflow-y: auto; padding: 16px 20px; background: #f9fafb; }
        .message { margin-bottom: 16px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.ai { align-items: flex-start; }
        .bubble { max-width: 80%; padding: 10px 16px; border-radius: 18px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; font-size: 15px; }
        .user .bubble { background: #1677ff; color: white; border-bottom-right-radius: 4px; }
        .ai .bubble { background: white; color: #333; border: 1px solid #e5e6eb; border-bottom-left-radius: 4px; }
        .reference { font-size: 13px; color: #999; margin-top: 6px; padding: 8px 12px; background: #f0f0f0; border-radius: 8px; max-width: 85%; }
        .reference summary { cursor: pointer; color: #666; font-weight: 500; }
        .reference blockquote { margin: 4px 0; padding-left: 8px; border-left: 3px solid #1677ff; color: #555; font-style: italic; font-size: 12px; }
        .input-area { display: flex; flex-direction: column; border-top: 1px solid #e5e6eb; padding: 12px 16px; background: white; gap: 8px; }
        .input-row { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #d9d9d9; border-radius: 22px; outline: none; font-size: 15px; }
        .input-area input:focus { border-color: #1677ff; }
        .input-area button { padding: 10px 22px; background: #1677ff; color: white; border: none; border-radius: 22px; cursor: pointer; font-size: 15px; white-space: nowrap; }
        .input-area button:hover { background: #4096ff; }
        .input-area button:disabled { background: #a0c4ff; cursor: not-allowed; }
        .loading { color: #999; font-size: 14px; padding: 8px 0; }
        .cursor-blink { animation: blink 0.8s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .thinking { color: #999; font-size: 13px; font-style: italic; padding: 4px 0; }
        .model-tag { font-size: 12px; color: #999; text-align: center; padding: 6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <span>📚 本地知识库问答</span>
        <div class="header-actions">
            <button onclick="clearChat()">🗑️ 新对话</button>
        </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <div class="input-row">
            <input type="text" id="questionInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') sendQuestion()">
            <button onclick="sendQuestion()" id="sendBtn">发送</button>
        </div>
    </div>
</div>
<script>
let conversationId = '';
let isStreaming = false;

async function sendQuestion() {
    if (isStreaming) return;

    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    if (!question) return;

    // 显示用户消息
    appendMessage('user', question);
    input.value = '';
    isStreaming = true;
    document.getElementById('sendBtn').disabled = true;

    // 创建 AI 消息占位
    const aiMsgDiv = createMessageDiv('ai');
    const bubble = aiMsgDiv.querySelector('.bubble');
    bubble.innerHTML = '<span class="thinking">🤔 思考中<span class="cursor-blink">|</span></span>';
    document.getElementById('chatBox').appendChild(aiMsgDiv);
    scrollToBottom();

    try {
        const resp = await fetch('/api/chat/stream', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                question,
                conversation_id: conversationId
            })
        });

        if (!resp.ok) {
            bubble.textContent = '⚠️ 请求失败，请检查后端是否运行。';
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullAnswer = '';
        let references = null;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const jsonStr = line.slice(6).trim();
                if (!jsonStr) continue;

                try {
                    const data = JSON.parse(jsonStr);

                    if (data.conversation_id) {
                        conversationId = data.conversation_id;
                    }

                    if (data.references) {
                        references = data.references;
                    }

                    if (data.token) {
                        fullAnswer += data.token;
                        // 渲染：回答 + 引用
                        let html = fullAnswer;

                        // 显示引用
                        if (references && references.length > 0) {
                            let refHtml = '<details class="reference"><summary>📖 参考了 ' + references.length + ' 篇文档</summary>';
                            references.forEach(ref => {
                                const src = ref.source || '未知来源';
                                refHtml += '<blockquote>【' + src + '】' + ref.text + '</blockquote>';
                            });
                            refHtml += '</details>';
                            html += refHtml;
                        }

                        // 添加闪烁光标表示还在生成
                        html += '<span class="cursor-blink">|</span>';
                        bubble.innerHTML = html;
                        scrollToBottom();
                    }

                    if (data.done) {
                        // 最终渲染（去掉光标）
                        let html = fullAnswer;
                        if (references && references.length > 0) {
                            let refHtml = '<details class="reference"><summary>📖 参考了 ' + references.length + ' 篇文档</summary>';
                            references.forEach(ref => {
                                const src = ref.source || '未知来源';
                                refHtml += '<blockquote>【' + src + '】' + ref.text + '</blockquote>';
                            });
                            refHtml += '</details>';
                            html += refHtml;
                        }
                        bubble.innerHTML = html;
                        scrollToBottom();
                    }
                } catch (e) {
                    console.warn('SSE parse error:', e, jsonStr);
                }
            }
        }
    } catch (err) {
        const lastBubble = document.querySelector('#chatBox .message:last-child .bubble');
        if (lastBubble) lastBubble.textContent = '⚠️ 网络错误，请检查连接。';
    }

    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
}

function createMessageDiv(role) {
    const div = document.createElement('div');
    div.className = 'message ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    div.appendChild(bubble);
    return div;
}

function appendMessage(role, content) {
    const box = document.getElementById('chatBox');
    const div = createMessageDiv(role);
    div.querySelector('.bubble').textContent = content;
    box.appendChild(div);
    scrollToBottom();
}

function scrollToBottom() {
    const box = document.getElementById('chatBox');
    box.scrollTop = box.scrollHeight;
}

function clearChat() {
    conversationId = '';
    document.getElementById('chatBox').innerHTML = '';
    // 重新显示欢迎语
    appendMessage('ai', '你好！我是你的本地知识库助手，请问有什么可以帮助你的？');
}
</script>
</body>
</html>
